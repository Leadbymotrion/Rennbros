      swap: ["Permutation de roues saisonnière", "Vos pneus d’été posés chez vous", "/fr/services/tires"],
      alt: { winter: "dans une rue enneigée", fall: "dans une rue aux érables d’automne", spring: "sous les arbres en fleurs", summer: "dans une rue ensoleillée d’été" },
      services: "Services et prix", servicesSub: "Huile, pneus, freins, batteries, diagnostic",
      site: "Site web", follow: "Suivez-nous",
      review: "Laisser un avis Google", reviewSub: "Merci! Ça aide les autres à nous trouver",
      email: "Courriel", save: "Ajouter à mes contacts", saveSub: "Renn Bros dans votre téléphone",
      area: "Ouest-de-l’Île et Montérégie-Ouest",
      paths: { book: "/fr/book", emergency: "/fr/emergency", services: "/fr/services", home: "/fr" },
    },
    en: {
      tag: "Mobile service: we come to you.",
      chips: ["Tires", "Brakes", "Oil", "Battery", "Diagnostic"],
      book: "Book a visit", bookSub: "Pick a service and a time. We confirm personally.",
      call: "Call", text: "Text",
      emergency: "Emergency", emergencySub: "Dead battery, flat tire, locked out",
      winter: ["Winter tires", "Required from December 1 to March 15", "/winter-tires"],
      swap: ["Seasonal wheel swap", "Summer tires on, at your place", "/services/tires"],
      alt: { winter: "on a snowy street", fall: "on a street of autumn maples", spring: "under trees in blossom", summer: "on a sunny summer street" },
      services: "Services and prices", servicesSub: "Oil, tires, brakes, batteries, diagnostics",
      site: "Website", follow: "Follow us",
      review: "Leave a Google review", reviewSub: "Thank you! It helps others find us",
      email: "Email", save: "Save our contact", saveSub: "Renn Bros in your phone",
      area: "West Island and Montérégie-Ouest",
      paths: { book: "/book", emergency: "/emergency", services: "/services", home: "/" },
    },
  };
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
  const root = document.documentElement;
  let lang = "fr";
  const setLang = (l) => {
    lang = l;
    const t = T[lang], season = root.dataset.season;
    const [title, sub, path] = season === "winter" || season === "fall" ? t.winter : t.swap;
    t.season = title; t.seasonSub = sub; t.paths.season = path;
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t[el.dataset.t]; });
    document.querySelector("[data-chips]").innerHTML = t.chips.map((c) => `<li>${c}</li>`).join("");
    document.querySelectorAll("[data-href]").forEach((a) => { a.href = t.paths[a.dataset.href]; });
    document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    document.getElementById("heroImg").alt = `${lang === "fr" ? "Le camion et la remorque Renn Bros" : "The Renn Bros truck and trailer"} ${t.alt[season]}`;
  };
  setLang(store.get("rennbros.links.lang") || ((navigator.language || "fr").toLowerCase().startsWith("en") ? "en" : "fr"));
  document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => { setLang(b.dataset.lang); store.set("rennbros.links.lang", b.dataset.lang); }));

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const G = window.gsap;
  const img = document.getElementById("heroImg");

  if (G && !reduce) {
    G.timeline({ defaults: { ease: "expo.out", duration: 1.1 } })
      .fromTo("#hero", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" })
      .fromTo(img, { scale: 1.16 }, { scale: 1.04, duration: 2.4 }, 0)
      .fromTo(".id", { opacity: 0, y: 34 }, { opacity: 1, y: 0 }, 0.35)
      .fromTo(".id .mark", { scale: 0.6, rotate: -10 }, { scale: 1, rotate: 0, duration: 1.2, ease: "back.out(1.8)" }, 0.45)
      .fromTo(".id h1, .id .tag, .id .chips", { opacity: 0, y: 10 }, { opacity: 1, y: 0, stagger: 0.07 }, 0.55)
      .fromTo(".book", { opacity: 0, y: 24, scale: 0.97 }, { opacity: 1, y: 0, scale: 1 }, 0.7)
      .fromTo(".q", { opacity: 0, y: 18 }, { opacity: 1, y: 0, stagger: 0.07 }, 0.8)
      .fromTo(".row, .label, footer", { opacity: 0, y: 16 }, { opacity: 1, y: 0, stagger: 0.04 }, 0.9);
    // A slow drift on the photo, and a gentle parallax as the page scrolls.
    G.to(img, { xPercent: -1.6, duration: 9, ease: "sine.inOut", yoyo: true, repeat: -1, delay: 2.4 });
    let ticking = false;
    addEventListener("scroll", () => {
      if (ticking) return; ticking = true;
      requestAnimationFrame(() => { G.set(img, { y: Math.min(scrollY, 400) * 0.25 }); ticking = false; });
    }, { passive: true });
    G.to(".book .shine", { x: "120%", duration: 1.3, ease: "power2.inOut", repeat: -1, repeatDelay: 3.4, delay: 2 });
    document.querySelectorAll(".book, .q, .row").forEach((el) => {
      el.addEventListener("pointerdown", () => G.to(el, { scale: 0.97, duration: 0.15, ease: "power2.out" }));
      const up = () => G.to(el, { scale: 1, duration: 0.6, ease: "elastic.out(1, 0.45)" });
      el.addEventListener("pointerup", up); el.addEventListener("pointerleave", up); el.addEventListener("pointercancel", up);
    });
  } else {
    document.querySelectorAll(".in").forEach((el) => (el.style.opacity = 1));
  }

  /* The season over the photo (2D canvas: cheap, smooth, pauses when the tab is hidden).
     winter: snow · fall: maple leaves tumbling · spring: blossom petals on the breeze · summer: warm light rising */
  const cv = document.getElementById("fx"), cx = cv.getContext("2d");
  let W = 0, H = 0, ps = [], mode = "", run = !reduce;
  const dpr = Math.min(devicePixelRatio || 1, 2), R = Math.random, TAU = 6.2832;
  const LEAF = ["#d9541e", "#e8892b", "#c23a1a", "#f0b13a", "#b8461c"];
  const PETAL = ["#f7c6d4", "#fbdde6", "#ffffff", "#f3b3c8"];
  const DENSITY = { winter: 2600, fall: 9500, spring: 7000, summer: 9000 };
  const make = (fresh) => {
    const p = { x: R() * W, y: fresh ? R() * H : -12, w: R() * TAU, spin: R() * TAU };
    if (mode === "winter") Object.assign(p, { r: 0.6 + R() * 2.1, vy: 12 + R() * 34, vx: 0 });
    if (mode === "fall") Object.assign(p, { r: 7 + R() * 5, vy: 22 + R() * 26, vx: -6 + R() * 12, vs: (R() - 0.5) * 3, c: LEAF[(R() * LEAF.length) | 0], kind: R() < 0.65 });
    if (mode === "spring") Object.assign(p, { r: 2.6 + R() * 2.4, vy: 14 + R() * 18, vx: 14 + R() * 18, vs: (R() - 0.5) * 4, c: PETAL[(R() * PETAL.length) | 0] });
    if (mode === "summer") Object.assign(p, { r: 1.4 + R() * 3, vy: -(5 + R() * 10), vx: 2 + R() * 4, y: fresh ? R() * H : H + 8 });
    if (mode === "spring" && !fresh) { p.x = -10; p.y = R() * H * 0.8; }
    return p;
  };
  const size = () => {
    W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ps = Array.from({ length: Math.round(W * H / DENSITY[mode]) }, () => make(true));
  };
  // The maple leaf outline (public-domain flag drawing, about 4000 units tall), and a plain oval leaf for variety.
  const MAPLE = new Path2D("m-90 2030 45-863a95 95 0 0 0-111-98l-859 151 116-320a65 65 0 0 0-20-73l-941-762 212-99a65 65 0 0 0 34-79l-186-572 542 115a65 65 0 0 0 73-38l105-247 423 454a65 65 0 0 0 111-57l-204-1052 327 189a65 65 0 0 0 91-27l332-652 332 652a65 65 0 0 0 91 27l327-189-204 1052a65 65 0 0 0 111 57l423-454 105 247a65 65 0 0 0 73 38l542-115-186 572a65 65 0 0 0 34 79l212 99-941 762a65 65 0 0 0-20 73l116 320-859-151a95 95 0 0 0-111 98l45 863z");
  const leaf = (p) => {
    // Tumbling: the leaf turns over (scaleX follows a cosine) as it spins down.
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.spin); cx.scale(Math.cos(p.w * 1.3), 1);
    cx.fillStyle = p.c;
    if (p.kind) { cx.scale(p.r / 2000, p.r / 2000); cx.fill(MAPLE); }
    else {
      cx.beginPath(); cx.ellipse(0, 0, p.r * 0.48, p.r * 0.9, 0, 0, TAU); cx.fill();
      cx.strokeStyle = "rgba(90,40,10,.35)"; cx.lineWidth = 0.7; cx.beginPath(); cx.moveTo(0, -p.r * 0.8); cx.lineTo(0, p.r * 1.15); cx.stroke();
    }
    cx.restore();
  };
  const petal = (p) => {
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.spin); cx.scale(1, 0.55 + 0.45 * Math.abs(Math.cos(p.w * 1.6)));
    cx.fillStyle = p.c; cx.globalAlpha = 0.92; cx.beginPath(); cx.ellipse(0, 0, p.r, p.r * 0.62, 0, 0, TAU); cx.fill(); cx.restore();
  };
  const mote = (p, now) => {
    const a = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(now / 700 + p.w * 5));
    const g = cx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3.2);
    g.addColorStop(0, `rgba(255,246,214,${a})`); g.addColorStop(1, "rgba(255,226,150,0)");
    cx.fillStyle = g; cx.beginPath(); cx.arc(p.x, p.y, p.r * 3.2, 0, TAU); cx.fill();
  };
  let last = performance.now();
  const tick = (now) => {
    if (!run) return;
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    cx.clearRect(0, 0, W, H);
    if (mode === "summer") {
      // A soft sun flare from the top right corner, breathing slowly.
      const g = cx.createRadialGradient(W * 0.96, -H * 0.06, 0, W * 0.96, -H * 0.06, W * 0.75);
      g.addColorStop(0, `rgba(255,236,190,${0.42 + 0.08 * Math.sin(now / 1800)})`); g.addColorStop(1, "rgba(255,236,190,0)");
      cx.globalAlpha = 1; cx.fillStyle = g; cx.fillRect(0, 0, W, H);
    }
    for (let i = 0; i < ps.length; i++) {
      const p = ps[i];
      p.w += dt; p.y += p.vy * dt; p.x += p.vx * dt;
      if (mode === "winter") {
        p.x += Math.sin(p.w) * 0.25;
        cx.globalAlpha = 0.35 + p.r / 4.5; cx.fillStyle = "#ffffff"; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, TAU); cx.fill();
      } else if (mode === "fall") {
        p.x += Math.sin(p.w * 1.1) * 0.6; p.spin += p.vs * dt; cx.globalAlpha = 0.95; leaf(p);
      } else if (mode === "spring") {
        p.y += Math.sin(p.w * 1.4) * 0.35; p.spin += p.vs * dt; petal(p);
      } else {
        p.x += Math.sin(p.w * 0.8) * 0.15; cx.globalAlpha = 1; mote(p, now);
      }
      if (p.y > H + 14 || p.x > W + 14 || p.x < -14 || p.y < -14) ps[i] = make(false);
    }
    cx.globalAlpha = 1;
    requestAnimationFrame(tick);
  };
  const setSeason = (season) => {
    mode = season; root.dataset.season = season;
    const i = document.getElementById("heroImg");
    if (!(i.currentSrc || i.src).includes(`hero-${season}`)) {
      i.srcset = `/links-assets/hero-${season}-900.jpg 900w, /links-assets/hero-${season}.jpg 1400w`;
      i.src = `/links-assets/hero-${season}-900.jpg`;
    }
    setLang(lang);
    if (!reduce) size();
  };
  setSeason(root.dataset.season);
  addEventListener("resize", () => { if (!reduce) size(); });
  if (!reduce) requestAnimationFrame(tick);
  document.addEventListener("visibilitychange", () => { run = !reduce && document.visibilityState === "visible"; if (run) { last = performance.now(); requestAnimationFrame(tick); } });
  // The website decides the season (date in Montréal, or a pinned season); follow it if it differs.
  // Saved to a home screen, phones freeze this page; like the website, look for a newer
  // version every hour and on reopening, and refresh after an hour or more in the background.
  const EVERY = 60 * 60 * 1000;
  const build = () => fetch("/api/version", { cache: "no-store" }).then((r) => r.json()).then((j) => j.build || "").catch(() => "");
  let loaded = "", hiddenAt = 0;
  build().then((b) => { loaded = b; });
  const check = () => { if (document.visibilityState === "visible" && loaded) build().then((b) => { if (b && b !== loaded) location.reload(); }); };
  setInterval(check, EVERY);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") { hiddenAt = Date.now(); return; }
    if (hiddenAt && Date.now() - hiddenAt >= EVERY) location.reload(); else check();
    hiddenAt = 0;
  });
  addEventListener("pageshow", check);

  if (!root.dataset.seasonPinned) fetch("/api/season").then((r) => (r.ok ? r.json() : null)).then((j) => { if (j && j.season && j.season !== mode) setSeason(j.season); }).catch(() => {});
})();
</script>
