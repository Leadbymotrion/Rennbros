    },
  };
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
  const setLang = (lang) => {
    const t = T[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t[el.dataset.t]; });
    document.querySelector("[data-chips]").innerHTML = t.chips.map((c) => `<li>${c}</li>`).join("");

    // A slow drift on the photo, and a gentle parallax as the page scrolls.
    G.to(img, { xPercent: -1.6, duration: 9, ease: "sine.inOut", yoyo: true, repeat: -1, delay: 2.4 });
    let ticking = false;
    addEventListener("scroll", () => {
      if (ticking) return; ticking = true;
      requestAnimationFrame(() => { G.set(img, { y: Math.min(scrollY, 400) * 0.25 }); ticking = false; });
    }, { passive: true });
    G.to(".book .shine", { x: "120%", duration: 1.3, ease: "power2.inOut", repeat: -1, repeatDelay: 3.4, delay: 2 });
    document.querySelectorAll(".book, .q, .row").forEach((el) => {

    });
  } else {
    document.querySelectorAll(".in").forEach((el) => (el.style.opacity = 1));
  }

  /* Light snow over the photo (2D canvas: cheap, smooth, pauses when hidden) */
  if (reduce) return;
  const cv = document.getElementById("snow"), cx = cv.getContext("2d");
  let W = 0, H = 0, dpr = Math.min(devicePixelRatio || 1, 2), flakes = [];

  };
  size(); addEventListener("resize", size);

  const tick = (now) => {
    if (!run) return;
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    cx.clearRect(0, 0, W, H);
    for (const f of flakes) {
      f.y += f.v * dt; f.w += dt; f.x += Math.sin(f.w) * 0.25;

    }

  };
