<script src="/links-assets/gsap.min.js"></script>
<script src="/links-assets/three.min.js"></script>
<script>
(() => {
  const T = {
    fr: {
      tag: "Service mobile : on se déplace chez vous.",
      chips: ["Pneus", "Freins", "Huile", "Batterie", "Diagnostic"],
      book: "Réserver une visite", bookSub: "Choisissez un service et une heure. On confirme personnellement.",
      call: "Appeler", text: "Texto",
      emergency: "Urgence", emergencySub: "Batterie à plat, pneu crevé, clés enfermées",
      winter: "Pneus d’hiver", winterSub: "Obligatoires du 1er décembre au 15 mars",
      services: "Services et prix", servicesSub: "Huile, pneus, freins, batteries, diagnostic",
      site: "Site web", follow: "Suivez-nous",
      review: "Laisser un avis Google", reviewSub: "Merci! Ça aide les autres à nous trouver",
      email: "Courriel", save: "Ajouter à mes contacts", saveSub: "Renn Bros dans votre téléphone",
      area: "Ouest-de-l’Île et Montérégie-Ouest",
      paths: { book: "/fr/book", emergency: "/fr/emergency", winter: "/fr/winter-tires", services: "/fr/services", home: "/fr" },
    },
    en: {
      tag: "Mobile service: we come to you.",
      chips: ["Tires", "Brakes", "Oil", "Battery", "Diagnostic"],
      book: "Book a visit", bookSub: "Pick a service and a time. We confirm personally.",
      call: "Call", text: "Text",
      emergency: "Emergency", emergencySub: "Dead battery, flat tire, locked out",
      winter: "Winter tires", winterSub: "Required from December 1 to March 15",
      services: "Services and prices", servicesSub: "Oil, tires, brakes, batteries, diagnostics",
      site: "Website", follow: "Follow us",
      review: "Leave a Google review", reviewSub: "Thank you! It helps others find us",
      email: "Email", save: "Save our contact", saveSub: "Renn Bros in your phone",
      area: "West Island and Montérégie-Ouest",
      paths: { book: "/book", emergency: "/emergency", winter: "/winter-tires", services: "/services", home: "/" },
    },
  };
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
  const setLang = (lang) => {
    const t = T[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t[el.dataset.t]; });
    const chips = document.querySelector("[data-chips]");
    chips.innerHTML = t.chips.map((c) => `<li>${c}</li>`).join("");
    document.querySelectorAll("[data-href]").forEach((a) => { a.href = t.paths[a.dataset.href]; });
    document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  };
  const first = store.get("rennbros.links.lang") || ((navigator.language || "fr").toLowerCase().startsWith("en") ? "en" : "fr");
  setLang(first);
  document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => { setLang(b.dataset.lang); store.set("rennbros.links.lang", b.dataset.lang); }));

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const G = window.gsap;

  /* Entrance and touch feedback */
  if (G && !reduce) {
    G.timeline({ defaults: { ease: "expo.out", duration: 1.1 } })
      .fromTo("#hero", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 1.6 })
      .fromTo(".mark", { opacity: 0, y: 18, rotate: -8 }, { opacity: 1, y: 0, rotate: 0 }, 0.25)
      .fromTo("h1", { opacity: 0, y: 22, letterSpacing: "0.12em" }, { opacity: 1, y: 0, letterSpacing: "0.02em" }, 0.35)
      .fromTo(".tag, .chips", { opacity: 0, y: 14 }, { opacity: 1, y: 0, stagger: 0.08 }, 0.5)
      .fromTo(".book", { opacity: 0, y: 26, scale: 0.97 }, { opacity: 1, y: 0, scale: 1 }, 0.62)
      .fromTo(".q", { opacity: 0, y: 20 }, { opacity: 1, y: 0, stagger: 0.07 }, 0.72)
      .fromTo(".row, .label, footer", { opacity: 0, y: 18 }, { opacity: 1, y: 0, stagger: 0.045 }, 0.82);
    G.to(".book .shine", { x: "120%", duration: 1.3, ease: "power2.inOut", repeat: -1, repeatDelay: 3.2, delay: 1.8 });
    document.querySelectorAll(".book, .q, .row").forEach((el) => {
      el.addEventListener("pointerdown", () => G.to(el, { scale: 0.97, duration: 0.15, ease: "power2.out" }));
      const up = () => G.to(el, { scale: 1, duration: 0.6, ease: "elastic.out(1, 0.45)" });
      el.addEventListener("pointerup", up); el.addEventListener("pointerleave", up); el.addEventListener("pointercancel", up);
    });
  } else {
    document.querySelectorAll(".in").forEach((el) => (el.style.opacity = 1));
  }

  /* The tire: rubber with tread lugs, a five-spoke rim, a red caliper, falling snow */
  const canvas = document.getElementById("tire");
  const THREE = window.THREE;
  let gl = null;
  try { gl = THREE && canvas.getContext("webgl", { antialias: true, alpha: true }); } catch {}
  if (!gl) { document.getElementById("hero").classList.add("nogl"); return; }

  const renderer = new THREE.WebGLRenderer({ canvas, context: gl, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
  camera.position.set(0, 0.15, 7.2);

  scene.add(new THREE.HemisphereLight(0xe8eef6, 0x0c0d10, 0.5));
  const key = new THREE.DirectionalLight(0xffffff, 1.35); key.position.set(3.5, 4, 6); scene.add(key);
  const fill = new THREE.DirectionalLight(0x9fb4d0, 0.35); fill.position.set(-4, 1, 3); scene.add(fill);
  const rim = new THREE.PointLight(0xff3038, 1.1, 10); rim.position.set(-2.8, -1.2, -1.6); scene.add(rim);

  const wheel = new THREE.Group();
  const rubber = new THREE.MeshStandardMaterial({ color: 0x111215, roughness: 0.86, metalness: 0.03 });
  const metal = new THREE.MeshStandardMaterial({ color: 0xc9ced6, roughness: 0.28, metalness: 0.9 });
  const darkMetal = new THREE.MeshStandardMaterial({ color: 0x3a3f46, roughness: 0.4, metalness: 0.8 });
  const red = new THREE.MeshStandardMaterial({ color: 0xc8161d, roughness: 0.35, metalness: 0.3, emissive: 0x3a0004 });

  // A real tire cross-section (bead, sidewall, shoulder, tread), turned around the axle.
  const profile = [[1.0,-0.4],[1.1,-0.46],[1.35,-0.49],[1.55,-0.47],[1.65,-0.42],[1.7,-0.33],[1.71,0],[1.7,0.33],[1.65,0.42],[1.55,0.47],[1.35,0.49],[1.1,0.46],[1.0,0.4]].map(([r, y]) => new THREE.Vector2(r, y));
  const tire = new THREE.Mesh(new THREE.LatheGeometry(profile, 120), rubber);
  tire.rotation.x = Math.PI / 2;
  wheel.add(tire);
  // Shallow tread blocks in two staggered rows.
  const block = new THREE.BoxGeometry(0.05, 0.12, 0.27);
  const LUGS = 60;
  const lugs = new THREE.InstancedMesh(block, rubber, LUGS * 2);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(1, 1, 1), p = new THREE.Vector3();
  for (let i = 0; i < LUGS * 2; i++) {
    const row = i % 2, a = ((Math.floor(i / 2) + row * 0.5) / LUGS) * Math.PI * 2;
    p.set(Math.cos(a) * 1.725, Math.sin(a) * 1.725, row ? 0.16 : -0.16);
    q.setFromEuler(new THREE.Euler(0, 0, a + (row ? 0.18 : -0.18)));
    m.compose(p, q, s); lugs.setMatrixAt(i, m);
  }
  wheel.add(lugs);
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.98, 0.98, 0.5, 64, 1, true), darkMetal);
  barrel.rotation.x = Math.PI / 2; wheel.add(barrel);
  const lip = new THREE.Mesh(new THREE.TorusGeometry(0.96, 0.05, 12, 80), metal); lip.position.z = 0.26; wheel.add(lip);
  for (let i = 0; i < 5; i++) {
    const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.92, 0.07), metal);
    const a = (i / 5) * Math.PI * 2;
    spoke.position.set(Math.sin(a) * 0.48, Math.cos(a) * 0.48, 0.2); spoke.rotation.z = -a; wheel.add(spoke);
  }
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.24, 0.16, 32), metal); hub.rotation.x = Math.PI / 2; hub.position.z = 0.22; wheel.add(hub);
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.78, 0.78, 0.06, 64), darkMetal); disc.rotation.x = Math.PI / 2; disc.position.z = 0.02;

  const assembly = new THREE.Group();
  assembly.add(disc);
  const caliper = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.62, 0.22), red);
  caliper.position.set(0.66, 0.42, 0.12); caliper.rotation.z = -0.55;
  assembly.add(caliper, wheel);
  assembly.rotation.set(0.08, -0.55, 0);
  scene.add(assembly);

  /* Snow */
  const N = 420;
  const pos = new Float32Array(N * 3), speed = new Float32Array(N);
  for (let i = 0; i < N; i++) { pos[i * 3] = (Math.random() - 0.5) * 9; pos[i * 3 + 1] = (Math.random() - 0.5) * 6; pos[i * 3 + 2] = (Math.random() - 0.5) * 5; speed[i] = 0.25 + Math.random() * 0.55; }
  const snowGeo = new THREE.BufferGeometry(); snowGeo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const dot = document.createElement("canvas"); dot.width = dot.height = 32;
  const c2 = dot.getContext("2d"); const g = c2.createRadialGradient(16, 16, 0, 16, 16, 16); g.addColorStop(0, "rgba(255,255,255,1)"); g.addColorStop(1, "rgba(255,255,255,0)"); c2.fillStyle = g; c2.fillRect(0, 0, 32, 32);
  const snow = new THREE.Points(snowGeo, new THREE.PointsMaterial({ size: 0.07, map: new THREE.CanvasTexture(dot), transparent: true, depthWrite: false, opacity: 0.9 }));
  scene.add(snow);

  const size = () => {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  };
  size(); addEventListener("resize", size);

  /* Follow the finger or pointer, gently */
  let tx = 0, ty = 0, cx = 0, cy = 0;
  addEventListener("pointermove", (e) => { tx = (e.clientX / innerWidth - 0.5) * 0.5; ty = (e.clientY / innerHeight - 0.5) * 0.3; }, { passive: true });

  let last = performance.now(), running = true, spin = 0;
  const frame = (now) => {
    if (!running) return;
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    spin += dt * (reduce ? 0 : 0.55);
    wheel.rotation.z = -spin;
    cx += (tx - cx) * 0.05; cy += (ty - cy) * 0.05;
    assembly.rotation.y = -0.55 + cx; assembly.rotation.x = 0.08 + cy;
    if (!reduce) {
      for (let i = 0; i < N; i++) {
        pos[i * 3 + 1] -= speed[i] * dt; pos[i * 3] += Math.sin(now * 0.0006 + i) * 0.0015;
        if (pos[i * 3 + 1] < -3) pos[i * 3 + 1] = 3;
      }
      snowGeo.attributes.position.needsUpdate = true;
    }
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
  document.addEventListener("visibilitychange", () => {
    running = document.visibilityState === "visible";
    if (running) { last = performance.now(); requestAnimationFrame(frame); }
  });
})();
</script>
